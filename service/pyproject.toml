[project]
name = "algorip"
version = "0.1.0"
description = "Algobooth's rip pipeline: turns a clip into Strudel code"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.150.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.1",
    "yt-dlp==2026.8.19",
    "numpy==2.4.6",
    "scipy==1.17.1",
    "librosa==0.11.0",
    "soundfile==0.14.0",
    "basic-pitch[onnx]==0.4.0",
    "anthropic==1.15.0",
    "httpx==0.28.1",
    "mir_eval==0.8.2",
    "pip==26.2.1",
    # basic-pitch pins resampy<0.4.3, which imports pkg_resources; setuptools 82 removed it
    "setuptools==81.0.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-socket==0.8.1",
]

[tool.pytest.ini_options]
# Unix sockets stay allowed: asyncio (FastAPI's TestClient) builds its event loop on a socketpair.
# Every inet socket is still blocked, so no test touches the network.
addopts = "--disable-socket --allow-unix-socket"
testpaths = ["tests"]
markers = ["slow: a timing budget on a 60 s stem"]
filterwarnings = [
    # audioread (via librosa) imports stdlib modules Python 3.13 removes; not ours to fix
    "ignore:'(aifc|audioop|sunau)' is deprecated:DeprecationWarning",
    # resampy (via basic-pitch) imports pkg_resources; see the setuptools pin above
    "ignore:pkg_resources is deprecated:UserWarning",
]
